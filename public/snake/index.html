<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>El Gusanito de Romano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080816;overflow:hidden;font-family:'Outfit','Space Grotesk',sans-serif;color:#fff;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    canvas#game{display:block}
    #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:radial-gradient(ellipse at center,rgba(20,20,50,.95),rgba(8,8,22,.98));backdrop-filter:blur(12px);overflow-y:auto}
    #menu.hidden{display:none}
    .menu-box{text-align:center;padding:30px 36px;border-radius:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:92vw;margin:16px 0}
    .menu-box h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,6vw,42px);font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,#6EE7B7,#3B82F6,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
    .menu-box .subtitle{color:rgba(255,255,255,.3);margin-bottom:16px;font-size:12px;letter-spacing:2px;text-transform:uppercase}
    #nameInput{display:block;width:260px;max-width:80vw;margin:0 auto 12px;padding:11px 16px;font-family:'Outfit',sans-serif;font-size:16px;font-weight:600;border:2px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;text-align:center;outline:none}
    #nameInput:focus{border-color:rgba(110,231,183,.5)}
    #nameInput::placeholder{color:rgba(255,255,255,.2)}
    .section-label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.3);margin-bottom:8px;margin-top:12px}
    #colorEditor{display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .color-pick{width:36px;height:36px;border:none;border-radius:10px;cursor:pointer;padding:0;background:none;-webkit-appearance:none}
    .color-pick::-webkit-color-swatch-wrapper{padding:0}
    .color-pick::-webkit-color-swatch{border:2px solid rgba(255,255,255,.2);border-radius:8px}
    .color-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
    #snakePreview{margin:0 auto 14px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
    .ctrl-btn{padding:10px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s}
    .ctrl-btn.selected{border-color:#6EE7B7;color:#6EE7B7;background:rgba(110,231,183,.08)}
    .play-btn{display:block;width:260px;max-width:80vw;margin:8px auto 0;padding:13px;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;border:none;border-radius:14px;background:linear-gradient(135deg,#6EE7B7,#3B82F6);color:#080816;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .play-btn:active{transform:scale(.98)}
    .controls-hint{margin-top:12px;color:rgba(255,255,255,.2);font-size:10px;line-height:1.8}
    .ranking-section{margin-top:14px;text-align:left}
    .ranking-section h4{font-family:'Space Grotesk',sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.3);margin-bottom:4px;text-align:center}
    .ranking-entry{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.03)}
    .ranking-entry:nth-child(2){color:#F59E0B;font-weight:700}
    .ranking-entry:nth-child(3){color:#C0C0C0;font-weight:600}
    .ranking-entry:nth-child(4){color:#CD7F32;font-weight:600}
    .ranking-name{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #deathScreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:90;background:rgba(8,8,22,.88);backdrop-filter:blur(8px);overflow-y:auto}
    #deathScreen.show{display:flex}
    .death-box{text-align:center;padding:28px 36px;border-radius:24px;background:rgba(255,255,255,.03);border:1px solid rgba(239,68,68,.2);box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:92vw;margin:16px 0}
    .death-box h2{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;color:#EF4444;margin-bottom:4px}
    .death-box p{color:rgba(255,255,255,.4);margin-bottom:8px;font-size:13px}
    #deathScore{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:800;background:linear-gradient(135deg,#6EE7B7,#3B82F6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    #hud{position:fixed;top:12px;left:12px;z-index:50;pointer-events:none}
    #score{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 2px 10px rgba(0,0,0,.6)}
    #effectsBar{margin-top:4px}
    .effect-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;margin-right:4px;color:#080816}
    #leaderboard{position:fixed;top:12px;right:12px;z-index:50;pointer-events:none;background:rgba(0,0,0,.3);border-radius:12px;padding:10px 14px;min-width:140px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.05)}
    #leaderboard h3{font-family:'Space Grotesk',sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.25);margin-bottom:6px}
    .lb-entry{display:flex;justify-content:space-between;font-size:11px;padding:1px 0;color:rgba(255,255,255,.5)}
    .lb-entry.you{color:#6EE7B7;font-weight:700}
    .lb-name{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #minimap{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:50;pointer-events:none;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.3)}
    #boostBar{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);z-index:49;pointer-events:none;width:130px;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
    #boostFill{height:100%;background:linear-gradient(90deg,#F59E0B,#EF4444);border-radius:2px;width:100%}
    #joystickArea{display:none;position:fixed;bottom:16px;left:12px;z-index:60;width:100px;height:100px}
    #joystickBase{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1)}
    #joystickThumb{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(110,231,183,.25);border:1.5px solid rgba(110,231,183,.4);top:50%;left:50%;transform:translate(-50%,-50%)}
    #boostBtn{display:none;position:fixed;bottom:28px;right:12px;z-index:61;width:56px;height:56px;border-radius:50%;background:rgba(245,158,11,.15);border:2px solid rgba(245,158,11,.35);color:rgba(255,255,255,.8);font-size:24px;cursor:pointer;-webkit-tap-highlight-color:transparent;align-items:center;justify-content:center}
    #boostBtn.active{background:rgba(245,158,11,.45);border-color:rgba(245,158,11,.7);transform:scale(1.08)}
    #pwToast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:80;pointer-events:none;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;opacity:0;transition:opacity .3s,transform .3s}
    #pwToast.show{opacity:1;transform:translate(-50%,-60%)}
    #subScore{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
    #killFeed{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px}
    #killFeed.hidden,#hud.hidden,#leaderboard.hidden,#minimap.hidden,#boostBar.hidden{display:none}
    .kf{font-size:11px;padding:3px 10px;border-radius:8px;background:rgba(0,0,0,.4);color:rgba(255,255,255,.7);white-space:nowrap;backdrop-filter:blur(4px)}
    .kf b{color:#fff}.kf-x{color:#EF4444}.kf-l{color:rgba(255,255,255,.35)}
    .kf.kf-me{background:rgba(110,231,183,.2);color:#6EE7B7}.kf.kf-dead{background:rgba(239,68,68,.2)}
    .lb-bot{font-size:9px;opacity:.6;margin-right:2px}
    #deathStats{display:flex;justify-content:center;gap:26px;margin:10px 0 4px}
    #deathStats div{display:flex;flex-direction:column;align-items:center}
    #deathStats b{font-family:'Space Grotesk',sans-serif;font-size:22px}
    #deathStats span{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px}
    .menu-link{display:block;margin:10px auto 0;background:none;border:none;color:rgba(255,255,255,.4);font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
    @media(max-width:700px){.menu-box{padding:24px 20px}#leaderboard{padding:6px 10px;min-width:110px}.lb-entry{font-size:10px}.lb-name{max-width:60px}#minimap{width:80px!important;height:80px!important;bottom:8px!important}#boostBar{display:none!important}#score{font-size:15px}}
    @media(hover:hover) and (pointer:fine){#game{cursor:none}#minimap{left:auto;right:12px;transform:none}}
  </style>
</head>
<body>
<div id="menu">
  <div class="menu-box">
    <h1>El Gusanito de Romano</h1>
    <div class="subtitle">multijugador online</div>
    <input type="text" id="nameInput" placeholder="Tu nombre..." maxlength="15" autofocus value="Romano">
    <div class="section-label">Tus colores</div>
    <div id="colorEditor"></div>
    <canvas id="snakePreview" width="240" height="50"></canvas>
    <div id="controlPicker" style="display:none">
      <div class="section-label">Controles</div>
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
        <button class="ctrl-btn selected" data-ctrl="joystick">🕹️ Joystick</button>
        <button class="ctrl-btn" data-ctrl="touch">👆 Tactil</button>
        <button class="ctrl-btn" data-ctrl="gyro">📱 Giroscopio</button>
      </div>
    </div>
    <button class="play-btn" id="playBtn">JUGAR</button>
    <div class="controls-hint" id="controlsHint">Mouse = dirección &middot; Click / Espacio = turbo<br>Encerrá a los otros gusanos para que choquen con vos</div>
    <div id="menuRanking" class="ranking-section"></div>
  </div>
</div>
<div id="deathScreen">
  <div class="death-box">
    <h2>Moriste</h2>
    <p id="deathMsg"></p>
    <div id="deathScore">0</div>
    <p style="margin-top:3px;font-size:11px;color:rgba(255,255,255,.2)">largo máximo</p>
    <div id="deathStats"></div>
    <div id="deathRanking" class="ranking-section"></div>
    <br>
    <button class="play-btn" id="playBtn2">REINTENTAR</button>
    <button class="menu-link" id="menuBtn2">Cambiar colores / nombre</button>
  </div>
</div>
<div id="hud" class="hidden"><div id="score">Largo: 0</div><div id="subScore"></div><div id="effectsBar"></div></div>
<div id="killFeed" class="hidden"></div>
<div id="leaderboard" class="hidden"><h3>Top Jugadores</h3><div id="lbList"></div></div>
<canvas id="minimap" class="hidden" width="120" height="120"></canvas>
<div id="boostBar" class="hidden"><div id="boostFill"></div></div>
<div id="joystickArea"><div id="joystickBase"></div><div id="joystickThumb"></div></div>
<button id="boostBtn">&#x1F680;</button>
<div id="pwToast"></div>
<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var mmCvs=document.getElementById('minimap'),mmCtx=mmCvs.getContext('2d');
var W,H,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';}
resize(); window.addEventListener('resize',resize);
var isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
var WORLD={w:2600,h:2600};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// Same formula as the server
function widthOf(len){return 10+Math.min(len/22,7)*2.6;}

// ── Color editor ──
var myColors=['#4ECDC4','#45B7D1','#6EE7B7'];
try{var sc0=localStorage.getItem('snakeColors');if(sc0){var arr=JSON.parse(sc0);if(arr&&arr.length)myColors=arr.slice(0,6);}var sn0=localStorage.getItem('snakeName');if(sn0)document.getElementById('nameInput').value=sn0;}catch(e){}
var colorEditor=document.getElementById('colorEditor');
var previewCvs=document.getElementById('snakePreview');

function buildColorEditor(){
  colorEditor.innerHTML='';
  for(var i=0;i<myColors.length;i++){
    (function(idx){
      var inp=document.createElement('input');
      inp.type='color'; inp.value=myColors[idx]; inp.className='color-pick';
      inp.oninput=function(){myColors[idx]=inp.value;drawPreview();};
      colorEditor.appendChild(inp);
    })(i);
  }
  var addBtn=document.createElement('button');addBtn.className='color-btn';addBtn.textContent='+';
  addBtn.onclick=function(){if(myColors.length<6){myColors.push('#ffffff');buildColorEditor();drawPreview();}};
  colorEditor.appendChild(addBtn);
  if(myColors.length>1){
    var rmBtn=document.createElement('button');rmBtn.className='color-btn';rmBtn.textContent='-';
    rmBtn.onclick=function(){myColors.pop();buildColorEditor();drawPreview();};
    colorEditor.appendChild(rmBtn);
  }
  var rndBtn=document.createElement('button');rndBtn.className='color-btn';rndBtn.textContent='🎲';rndBtn.title='Colores al azar';
  rndBtn.onclick=function(){var n=1+Math.floor(Math.random()*3);myColors=[];for(var k=0;k<n;k++)myColors.push(hslHex(Math.random()*360,80,58));buildColorEditor();drawPreview();};
  colorEditor.appendChild(rndBtn);
}
function hslHex(h,s,l){s/=100;l/=100;var k=function(n){return (n+h/30)%12;},a=s*Math.min(l,1-l);
  var f=function(n){var c=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return ('0'+Math.round(c*255).toString(16)).slice(-2);};
  return '#'+f(0)+f(8)+f(4);}

function drawPreview(){
  var c=previewCvs.getContext('2d');
  c.clearRect(0,0,240,50);
  var pal=palette(myColors.join(','));
  c.lineCap='round';
  for(var i=13;i>=0;i--){
    var x=205-i*13,y=25+Math.sin(i*0.55)*7,x2=205-(i+1)*13,y2=25+Math.sin((i+1)*0.55)*7;
    c.beginPath();c.moveTo(x2,y2);c.lineTo(x,y);c.lineWidth=15;c.strokeStyle=pal[i%pal.length];c.stroke();
  }
  c.beginPath();c.arc(207,25,9,0,Math.PI*2);c.fillStyle=pal[0];c.fill();
  c.beginPath();c.arc(210,20,3.5,0,Math.PI*2);c.arc(210,30,3.5,0,Math.PI*2);c.fillStyle='#fff';c.fill();
  c.beginPath();c.arc(211.5,20,1.8,0,Math.PI*2);c.arc(211.5,30,1.8,0,Math.PI*2);c.fillStyle='#111';c.fill();
}

// ── Colors ──
var palCache={};
function shade(hex,amt){
  var h=hex.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n=parseInt(h.slice(0,6),16);if(isNaN(n))return hex;
  var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r+amt)));g=Math.max(0,Math.min(255,Math.round(g+amt)));b=Math.max(0,Math.min(255,Math.round(b+amt)));
  return 'rgb('+r+','+g+','+b+')';
}
function palette(sk){
  if(palCache[sk])return palCache[sk];
  var cols=(!sk||sk==='classic')?['#4ECDC4']:sk.split(',').filter(function(c){return /^#[0-9a-fA-F]{3,8}$/.test(c);});
  if(!cols.length)cols=['#4ECDC4'];
  // A single color gets a darker stripe so the scales still read
  if(cols.length===1)cols=[cols[0],shade(cols[0],-38)];
  return palCache[sk]=cols;
}
buildColorEditor();drawPreview();

// ── Socket ──
var socket=io('/snake',{transports:['websocket']});
var myId=null,mouseX=W/2,mouseY=H/2,boosting=false,playing=false,lastScore=0,myKills=0,myRank=0,aliveCount=0,myName='';
var serverState=null,leaderboard=[];
var displayBuf={};
var particles=[],feed=[];
var camX=WORLD.w/2,camY=WORLD.h/2,zoom=1;

var PW_NAMES={speed:'¡Velocidad!',shield:'¡Escudo!',magnet:'¡Imán!',x2:'¡Puntos x2!',shrink:'¡Encogiste a todos!',ghost:'¡Fantasma!'};
var PW_COLORS={speed:'#FBBF24',shield:'#3B82F6',magnet:'#A78BFA',x2:'#22C55E',shrink:'#EF4444',ghost:'#94A3B8'};
var toastTimer=null;
function toast(text,color){
  var el=document.getElementById('pwToast');
  el.textContent=text;el.style.color=color||'#fff';
  el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},1500);
}
function renderRanking(el,data){
  if(!data||!data.length){el.innerHTML='';return;}
  var h='<h4>Récords</h4>';
  for(var i=0;i<data.length;i++) h+='<div class="ranking-entry"><span class="ranking-name">'+(i+1)+'. '+esc(data[i].n)+'</span><span>'+data[i].s+'</span></div>';
  el.innerHTML=h;
}

var menu=document.getElementById('menu'),deathScreen=document.getElementById('deathScreen');
var nameInput=document.getElementById('nameInput'),boostBtn=document.getElementById('boostBtn');
var joystickArea=document.getElementById('joystickArea'),joystickThumb=document.getElementById('joystickThumb');
if(isTouch) document.getElementById('controlsHint').innerHTML='Joystick = dirección &middot; &#x1F680; = turbo<br>Encerrá a los otros gusanos para que choquen con vos';

function showGameUI(){
  menu.classList.add('hidden');deathScreen.classList.remove('show');
  ['hud','leaderboard','minimap','boostBar','killFeed'].forEach(function(id){document.getElementById(id).classList.remove('hidden');});
  if(isTouch){boostBtn.style.display='flex';joystickArea.style.display=(controlMode==='joystick')?'block':'none';}
  playing=true;
}
function hideGameUI(){
  document.getElementById('hud').classList.add('hidden');
  if(isTouch){joystickArea.style.display='none';boostBtn.style.display='none';}
}
function joinData(){
  myName=nameInput.value.trim()||'Gusano';
  try{localStorage.setItem('snakeColors',JSON.stringify(myColors));localStorage.setItem('snakeName',myName);}catch(e){}
  return {name:myName,skin:myColors.join(',')};
}
function startGame(){serverState=null;displayBuf={};socket.emit('join',joinData());showGameUI();}
document.getElementById('playBtn').onclick=startGame;
document.getElementById('playBtn2').onclick=function(){serverState=null;displayBuf={};socket.emit('respawn',joinData());showGameUI();};
document.getElementById('menuBtn2').onclick=function(){deathScreen.classList.remove('show');menu.classList.remove('hidden');buildColorEditor();drawPreview();};
nameInput.onkeydown=function(e){if(e.key==='Enter')startGame();};
window.addEventListener('keydown',function(e){if(e.key==='Enter'&&deathScreen.classList.contains('show'))document.getElementById('playBtn2').click();});

// ── Control mode: 'joystick' | 'touch' | 'gyro' ──
var controlMode='joystick',gyroReady=false,touchAngle=0,joyAngle=0,gyroAngle=0;
var controlPicker=document.getElementById('controlPicker');
if(isTouch) controlPicker.style.display='block';
var ctrlBtns=document.querySelectorAll('.ctrl-btn');
for(var ci=0;ci<ctrlBtns.length;ci++){
  (function(btn){
    btn.onclick=function(){
      for(var j=0;j<ctrlBtns.length;j++) ctrlBtns[j].classList.remove('selected');
      btn.classList.add('selected');
      controlMode=btn.getAttribute('data-ctrl');
      if(controlMode==='gyro') requestGyro();
    };
  })(ctrlBtns[ci]);
}

canvas.onmousemove=function(e){if(!isTouch){mouseX=e.clientX;mouseY=e.clientY;}};
window.addEventListener('mousedown',function(){if(!isTouch)boosting=true;});
window.addEventListener('mouseup',function(){if(!isTouch)boosting=false;});
window.addEventListener('keydown',function(e){if(e.code==='Space'&&document.activeElement!==nameInput){boosting=true;e.preventDefault();}});
window.addEventListener('keyup',function(e){if(e.code==='Space')boosting=false;});
window.addEventListener('blur',function(){boosting=false;});

// ── Joystick ──
var joyTouchId=null;
function joyMove(cx,cy){
  var r=joystickArea.getBoundingClientRect();
  var dx=cx-r.left-r.width/2,dy=cy-r.top-r.height/2;
  var d=Math.sqrt(dx*dx+dy*dy);
  if(d>32){dx=dx/d*32;dy=dy/d*32;}
  joystickThumb.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
  if(d>8) joyAngle=Math.atan2(dy,dx);
}
function joyReset(){joystickThumb.style.transform='translate(-50%,-50%)';joyTouchId=null;}
joystickArea.addEventListener('touchstart',function(e){e.preventDefault();if(controlMode!=='joystick')return;var t=e.changedTouches[0];joyTouchId=t.identifier;joyMove(t.clientX,t.clientY);},{passive:false});
joystickArea.addEventListener('touchmove',function(e){e.preventDefault();if(controlMode!=='joystick')return;for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===joyTouchId){joyMove(e.changedTouches[i].clientX,e.changedTouches[i].clientY);break;}}},{passive:false});
joystickArea.addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===joyTouchId){joyReset();break;}}});
joystickArea.addEventListener('touchcancel',joyReset);

// ── Touch (tap anywhere on screen) ──
var moveTouchId=null;
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(controlMode!=='touch'||!playing)return;
  var t=e.changedTouches[0];moveTouchId=t.identifier;
  touchAngle=Math.atan2(t.clientY-H/2,t.clientX-W/2);
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(controlMode!=='touch'||!playing)return;
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===moveTouchId){touchAngle=Math.atan2(e.changedTouches[i].clientY-H/2,e.changedTouches[i].clientX-W/2);break;}
  }
},{passive:false});
canvas.addEventListener('touchend',function(e){
  for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===moveTouchId){moveTouchId=null;break;}}
});

// ── Gyroscope ──
function requestGyro(){
  if(gyroReady)return;
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')gyroReady=true;}).catch(function(){});
  } else gyroReady=true;
}
window.addEventListener('deviceorientation',function(e){
  if(controlMode!=='gyro'||!playing)return;
  var gamma=Math.max(-45,Math.min(45,e.gamma||0)),beta=Math.max(-45,Math.min(45,(e.beta||0)-40));
  gyroAngle=Math.atan2(beta,gamma);
});

// ── Boost button ──
var bTouchId=null;
boostBtn.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();bTouchId=e.changedTouches[0].identifier;boosting=true;boostBtn.classList.add('active');},{passive:false});
boostBtn.addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===bTouchId){boosting=false;boostBtn.classList.remove('active');bTouchId=null;break;}}});
boostBtn.addEventListener('touchcancel',function(){boosting=false;boostBtn.classList.remove('active');bTouchId=null;});

var inputAngle=0;
setInterval(function(){
  if(!playing)return;
  if(!isTouch)inputAngle=Math.atan2(mouseY-H/2,mouseX-W/2);
  else if(controlMode==='gyro')inputAngle=gyroAngle;
  else if(controlMode==='touch')inputAngle=touchAngle;
  else inputAngle=joyAngle;
  socket.emit('input',{angle:inputAngle,boost:boosting});
},33);

// ── Network ──
socket.on('cfg',function(c){WORLD.w=c.w;WORLD.h=c.h;});
socket.on('ranking',function(d){renderRanking(document.getElementById('menuRanking'),d);});
socket.on('powerup',function(d){toast(PW_NAMES[d.type]||d.type,PW_COLORS[d.type]);});
socket.on('connect',function(){if(playing){serverState=null;displayBuf={};socket.emit('respawn',joinData());}});

socket.on('s',function(s){
  myId=s.i;
  var up={players:{},food:s.f,powerups:s.pw||[]};
  for(var id in s.p){
    var sp=s.p[id];
    up.players[id]={name:sp.n,skin:sp.sk||'classic',segments:sp.s,len:sp.l||sp.s.length,boosting:!!sp.b,effects:sp.fx||[],angle:sp.a};
  }
  serverState=up;
  leaderboard=s.lb||[];
  lastScore=s.sc;myKills=s.k||0;myRank=s.rk||0;aliveCount=s.n||0;
});

socket.on('boom',function(d){
  var n=Math.min(70,12+Math.floor(d.l/4));
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=1+Math.random()*5;
    particles.push({x:d.x,y:d.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.012+Math.random()*.02,r:2+Math.random()*4,c:Math.random()<.3?'#fff':d.c});}
});

socket.on('kill',function(d){
  var mine=d.k===myName,me=d.v===myName;
  feed.unshift({t:Date.now(),html:'<b>'+esc(d.k)+'</b> <span class="kf-x">✂</span> '+esc(d.v)+' <span class="kf-l">('+d.l+')</span>',cls:mine?'kf-me':me?'kf-dead':''});
  if(feed.length>5)feed.length=5;
  renderFeed();
  if(mine&&playing)toast('¡Eliminaste a '+d.v+'!','#6EE7B7');
});
function renderFeed(){
  var now=Date.now();feed=feed.filter(function(f){return now-f.t<6000;});
  var h='';for(var i=0;i<feed.length;i++)h+='<div class="kf '+feed[i].cls+'" style="opacity:'+Math.max(.15,1-(now-feed[i].t)/6000)+'">'+feed[i].html+'</div>';
  document.getElementById('killFeed').innerHTML=h;
}
setInterval(renderFeed,500);

socket.on('dead',function(d){
  playing=false;serverState=null;displayBuf={};
  document.getElementById('deathMsg').textContent=d.killer?('Te eliminó '+d.killer):'¡Chocaste con el borde!';
  document.getElementById('deathScore').textContent=d.max||d.score||lastScore;
  var t=d.time||0;
  document.getElementById('deathStats').innerHTML='<div><b>'+(d.kills||0)+'</b><span>eliminados</span></div><div><b>'+Math.floor(t/60)+':'+('0'+t%60).slice(-2)+'</b><span>tiempo vivo</span></div>';
  if(d.ranking){renderRanking(document.getElementById('deathRanking'),d.ranking);renderRanking(document.getElementById('menuRanking'),d.ranking);}
  deathScreen.classList.add('show');hideGameUI();
});

// ── Smooth display: exponential smoothing per frame ──
var SMOOTH=0.2;
function getSmoothedSegs(id,target){
  if(!target||!target.length)return target;
  var buf=displayBuf[id];
  if(!buf||Math.abs(buf[0].x-target[0].x)+Math.abs(buf[0].y-target[0].y)>300){
    buf=[];for(var i=0;i<target.length;i++)buf.push({x:target[i].x,y:target[i].y});
    displayBuf[id]=buf;return buf;
  }
  while(buf.length<target.length){var l=buf[buf.length-1];buf.push({x:l.x,y:l.y});}
  while(buf.length>target.length)buf.pop();
  for(var j=0;j<target.length;j++){buf[j].x+=(target[j].x-buf[j].x)*SMOOTH;buf[j].y+=(target[j].y-buf[j].y)*SMOOTH;}
  return buf;
}

// ── Background: hexagon tiles ──
var hexPattern=null,HEX=26;
function buildHex(){
  var R=HEX,w=Math.sqrt(3)*R,tw=Math.round(w*2),th=Math.round(R*3*2),q=2;
  var c=document.createElement('canvas');c.width=tw*q;c.height=th*q;
  var g=c.getContext('2d');g.scale(q,q);
  g.fillStyle='#0B0F1C';g.fillRect(0,0,tw,th);
  function hex(cx,cy){
    g.beginPath();
    for(var i=0;i<6;i++){var a=Math.PI/3*i+Math.PI/6;g.lineTo(cx+Math.cos(a)*(R-2),cy+Math.sin(a)*(R-2));}
    g.closePath();
    var gr=g.createRadialGradient(cx,cy-R*.3,2,cx,cy,R);gr.addColorStop(0,'#1A2035');gr.addColorStop(1,'#111627');
    g.fillStyle=gr;g.fill();g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=2;g.stroke();
  }
  var sx=tw/2,sy=th/2;
  for(var row=-1;row<=4;row++)for(var col=-1;col<=3;col++)hex(col*w+(row%2?w/2:0),row*1.5*R);
  hexPattern=ctx.createPattern(c,'repeat');
  if(hexPattern.setTransform&&window.DOMMatrix)hexPattern.setTransform(new DOMMatrix().scale(1/q));
}
buildHex();

// ── Drawing (world coordinates) ──
var view={x0:0,y0:0,x1:0,y1:0};
function inView(x,y,m){return x>view.x0-m&&x<view.x1+m&&y>view.y0-m&&y<view.y1+m;}

function drawBackground(){
  ctx.fillStyle=hexPattern;ctx.fillRect(Math.max(0,view.x0),Math.max(0,view.y0),Math.min(WORLD.w,view.x1)-Math.max(0,view.x0),Math.min(WORLD.h,view.y1)-Math.max(0,view.y0));
  // Outside the arena
  ctx.fillStyle='rgba(120,20,30,.25)';
  if(view.x0<0)ctx.fillRect(view.x0,view.y0,-view.x0,view.y1-view.y0);
  if(view.x1>WORLD.w)ctx.fillRect(WORLD.w,view.y0,view.x1-WORLD.w,view.y1-view.y0);
  if(view.y0<0)ctx.fillRect(0,view.y0,WORLD.w,-view.y0);
  if(view.y1>WORLD.h)ctx.fillRect(0,WORLD.h,WORLD.w,view.y1-WORLD.h);
  ctx.strokeStyle='rgba(239,68,68,.8)';ctx.lineWidth=6;ctx.strokeRect(0,0,WORLD.w,WORLD.h);
  ctx.strokeStyle='rgba(239,68,68,.2)';ctx.lineWidth=22;ctx.strokeRect(-8,-8,WORLD.w+16,WORLD.h+16);
}

function drawFood(fl,now){
  for(var i=0;i<fl.length;i++){
    var f=fl[i],x=f[0],y=f[1];
    if(!inView(x,y,20))continue;
    var r=f[2]*(1+Math.sin(now*.004+x*.07+y*.05)*.12);
    ctx.fillStyle=f[3];
    ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(x,y,r*2.1,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.95;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,r*.35,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawPowerups(pwl,now){
  for(var i=0;i<pwl.length;i++){
    var pw=pwl[i];if(!inView(pw.x,pw.y,40))continue;
    var r=pw.r*(1+Math.sin(now*.005)*.15);
    ctx.globalAlpha=.15+Math.sin(now*.004)*.05;ctx.fillStyle=pw.c;ctx.beginPath();ctx.arc(pw.x,pw.y,r*2.2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(pw.x,pw.y,r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.stroke();
    ctx.font='15px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pw.ic,pw.x,pw.y+1);ctx.textBaseline='alphabetic';
  }
  ctx.globalAlpha=1;
}

function drawSnake(sn,segs,isMe,now){
  if(!segs||segs.length<2)return;
  var w=widthOf(sn.len),r=w/2,pal=palette(sn.skin),fx=sn.effects||[];
  var ghost=fx.indexOf('ghost')!==-1,spawn=fx.indexOf('spawn')!==-1,shield=fx.indexOf('shield')!==-1;
  var alpha=ghost?.35:spawn?(.45+.35*Math.sin(now*.02)):1;
  // Rough cull
  var vis=false;for(var v=0;v<segs.length;v+=3)if(inView(segs[v].x,segs[v].y,w)){vis=true;break;}
  if(!vis)return;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.globalAlpha=alpha;
  var n=segs.length;
  function path(){ctx.beginPath();ctx.moveTo(segs[n-1].x,segs[n-1].y);for(var i=n-2;i>=0;i--)ctx.lineTo(segs[i].x,segs[i].y);}
  // Boost glow
  if(sn.boosting){path();ctx.strokeStyle=pal[0];ctx.globalAlpha=alpha*(.25+Math.random()*.15);ctx.lineWidth=w+14;ctx.stroke();ctx.globalAlpha=alpha;}
  // Outline
  path();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=w+4;ctx.stroke();
  // Scales: short colored bands along the body, tail -> head
  var band=Math.max(10,r*2.1),acc=0,idx=0,started=false;
  var bands=[];
  var cur=[segs[0]];
  for(var i=1;i<n;i++){
    var a=segs[i-1],b=segs[i],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy);
    var t0=0;
    while(acc+d*(1-t0)>=band){
      var need=(band-acc)/d,t=t0+need;
      var p={x:a.x+dx*t,y:a.y+dy*t};
      cur.push(p);bands.push({pts:cur,c:idx});idx++;
      cur=[p];acc=0;t0=t;
    }
    acc+=d*(1-t0);cur.push(b);
  }
  if(cur.length>1)bands.push({pts:cur,c:idx});
  ctx.lineWidth=w;
  for(var k=bands.length-1;k>=0;k--){
    var bp=bands[k].pts;
    ctx.beginPath();ctx.moveTo(bp[0].x,bp[0].y);for(var m=1;m<bp.length;m++)ctx.lineTo(bp[m].x,bp[m].y);
    ctx.strokeStyle=pal[bands[k].c%pal.length];ctx.stroke();
  }
  // Shine
  ctx.save();ctx.translate(-r*.22,-r*.28);path();ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=w*.3;ctx.stroke();ctx.restore();

  // Head
  var hd=segs[0],nx=segs[1],ang=Math.atan2(hd.y-nx.y,hd.x-nx.x);
  var hr=r*1.12;
  ctx.fillStyle=pal[0];ctx.beginPath();ctx.arc(hd.x,hd.y,hr,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.stroke();
  // Eyes look where the snake wants to go
  var look=isMe?inputAngle:(typeof sn.angle==='number'?sn.angle:ang);
  var eo=hr*.5,er=Math.max(2.4,hr*.42),pr=er*.55;
  for(var s=-1;s<=1;s+=2){
    var ex=hd.x+Math.cos(ang)*hr*.3+Math.cos(ang+Math.PI/2*s)*eo,ey=hd.y+Math.sin(ang)*hr*.3+Math.sin(ang+Math.PI/2*s)*eo;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,er,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+Math.cos(look)*er*.4,ey+Math.sin(look)*er*.4,pr,0,Math.PI*2);ctx.fill();
  }
  if(shield){ctx.strokeStyle='rgba(59,130,246,'+(.5+.3*Math.sin(now*.01))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(hd.x,hd.y,hr+9,0,Math.PI*2);ctx.stroke();}
  ctx.globalAlpha=1;
  // Name (constant screen size)
  var fs=12/zoom;
  ctx.font='700 '+fs+"px 'Outfit',sans-serif";ctx.textAlign='center';
  ctx.lineWidth=3/zoom;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(sn.name,hd.x,hd.y-hr-8/zoom);
  ctx.fillStyle=isMe?'#fff':'rgba(255,255,255,.75)';ctx.fillText(sn.name,hd.x,hd.y-hr-8/zoom);
}

function drawParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    if(!inView(p.x,p.y,10))continue;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawMinimap(st){
  var mw=mmCvs.width,mh=mmCvs.height;mmCtx.clearRect(0,0,mw,mh);
  mmCtx.fillStyle='rgba(255,255,255,.03)';mmCtx.beginPath();mmCtx.arc(mw/2,mh/2,mw/2-1,0,Math.PI*2);mmCtx.fill();
  mmCtx.strokeStyle='rgba(239,68,68,.35)';mmCtx.lineWidth=1;mmCtx.strokeRect(1,1,mw-2,mh-2);
  var pws=st.powerups||[];mmCtx.globalAlpha=.7;
  for(var j=0;j<pws.length;j++){mmCtx.fillStyle=pws[j].c;mmCtx.fillRect((pws[j].x/WORLD.w)*mw-1.5,(pws[j].y/WORLD.h)*mh-1.5,3,3);}
  mmCtx.globalAlpha=1;
  for(var id in st.players){var p=st.players[id],h=p.segments[0],me=id===myId;
    mmCtx.beginPath();mmCtx.arc((h.x/WORLD.w)*mw,(h.y/WORLD.h)*mh,me?3.5:Math.min(4,1.5+p.len/120),0,Math.PI*2);
    mmCtx.fillStyle=me?'#fff':palette(p.skin)[0];mmCtx.fill();}
  // View rectangle
  mmCtx.strokeStyle='rgba(255,255,255,.25)';
  mmCtx.strokeRect(view.x0/WORLD.w*mw,view.y0/WORLD.h*mh,(view.x1-view.x0)/WORLD.w*mw,(view.y1-view.y0)/WORLD.h*mh);
}

var FX_LABELS={speed:['⚡ Velocidad','#FBBF24'],shield:['🛡️ Escudo','#3B82F6'],magnet:['🧲 Imán','#A78BFA'],x2:['✖️2 Puntos','#22C55E'],ghost:['👻 Fantasma','#94A3B8'],spawn:['✨ Protegido','#E5E7EB']};
var lastFxHTML='';
function updateFx(effects){
  var h='';for(var i=0;i<(effects||[]).length;i++){var l=FX_LABELS[effects[i]];if(l)h+='<span class="effect-badge" style="background:'+l[1]+'">'+l[0]+'</span>';}
  if(h!==lastFxHTML){document.getElementById('effectsBar').innerHTML=h;lastFxHTML=h;}
}

var lbFrame=0,lastHud='';
function render(){
  requestAnimationFrame(render);
  var now=Date.now();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#070A14';ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!serverState||!playing)return;
  var me=serverState.players[myId];
  if(!me||!me.segments||!me.segments.length)return;
  var mySegs=getSmoothedSegs(myId,me.segments);

  // Camera: follows the head, zooms out as you grow and on small screens
  camX=mySegs[0].x;camY=mySegs[0].y;
  var base=Math.max(.62,Math.min(1.25,Math.min(W,H)/680));
  var target=base/(1+Math.max(0,me.len-15)/420);
  zoom+=(Math.max(base*.5,target)-zoom)*.04;
  view.x0=camX-W/2/zoom;view.x1=camX+W/2/zoom;view.y0=camY-H/2/zoom;view.y1=camY+H/2/zoom;
  ctx.setTransform(zoom*DPR,0,0,zoom*DPR,(W/2-camX*zoom)*DPR,(H/2-camY*zoom)*DPR);

  drawBackground();
  drawFood(serverState.food,now);
  drawPowerups(serverState.powerups||[],now);
  // Smaller snakes under bigger ones
  var ids=Object.keys(serverState.players).sort(function(a,b){return serverState.players[a].len-serverState.players[b].len;});
  for(var i=0;i<ids.length;i++){
    var id=ids[i],p=serverState.players[id];
    drawSnake(p,id===myId?mySegs:getSmoothedSegs(id,p.segments),id===myId,now);
  }
  drawParticles();

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!isTouch){ctx.beginPath();ctx.arc(mouseX,mouseY,4,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;ctx.stroke();}

  var hud='Largo: '+lastScore;
  if(hud!==lastHud){document.getElementById('score').textContent=hud;lastHud=hud;}
  var sub='💀 '+myKills+(myRank?' &middot; #'+myRank+' de '+aliveCount:'');
  var subEl=document.getElementById('subScore');if(subEl.innerHTML!==sub)subEl.innerHTML=sub;
  var bp=Math.max(0,Math.min(100,(lastScore-10)/40*100));
  document.getElementById('boostFill').style.width=bp+'%';
  updateFx(me.effects);

  if(++lbFrame%10===0){
    var lbh='';
    for(var li=0;li<leaderboard.length;li++){var e=leaderboard[li],u=e.i===myId;
      lbh+='<div class="lb-entry'+(u?' you':'')+'"><span class="lb-name">'+(li+1)+'. '+(e.b?'<span class="lb-bot">🤖</span>':'')+esc(e.n)+'</span><span>'+e.s+'</span></div>';}
    if(myRank>leaderboard.length)lbh+='<div class="lb-entry you"><span class="lb-name">'+myRank+'. '+esc(me.name)+'</span><span>'+lastScore+'</span></div>';
    document.getElementById('lbList').innerHTML=lbh;
    drawMinimap(serverState);
  }
}
render();
})();
</script>
